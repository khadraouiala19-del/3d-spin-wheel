<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>العجلة ثلاثية الأبعاد الفريدة 3D Spin Wheel</title>
  <style>
    :root {
      --bg-color: #0b0e14;
      --accent-color: #00ffcc;
      --panel-bg: rgba(22, 27, 34, 0.85);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg-color);
      color: #fff;
      overflow: hidden;
      height: 100vh;
      display: flex;
    }

    #canvas-container {
      flex: 1;
      height: 100%;
      position: relative;
    }

    /* لوحة التحكم الجانبية */
    .sidebar {
      width: 320px;
      background: var(--panel-bg);
      backdrop-filter: blur(12px);
      border-right: 1px solid rgba(255, 255, 255, 0.1);
      padding: 25px 20px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      z-index: 10;
      box-shadow: 10px 0 30px rgba(0,0,0,0.5);
    }

    h2 {
      font-size: 1.4rem;
      color: var(--accent-color);
      text-shadow: 0 0 10px rgba(0, 255, 204, 0.3);
      text-align: center;
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    label {
      font-size: 0.9rem;
      color: #a0aec0;
    }

    textarea {
      width: 100%;
      height: 180px;
      background: rgba(0, 0, 0, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 8px;
      color: #fff;
      padding: 12px;
      font-size: 0.95rem;
      resize: none;
      outline: none;
      transition: border-color 0.3s;
    }

    textarea:focus {
      border-color: var(--accent-color);
    }

    .btn-spin {
      background: linear-gradient(135deg, #00ffcc 0%, #0099ff 100%);
      border: none;
      border-radius: 8px;
      color: #000;
      font-weight: bold;
      font-size: 1.1rem;
      padding: 14px;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
      box-shadow: 0 4px 15px rgba(0, 255, 204, 0.4);
    }

    .btn-spin:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(0, 255, 204, 0.6);
    }

    .btn-spin:active {
      transform: translateY(1px);
    }

    .btn-spin:disabled {
      background: #4a5568;
      box-shadow: none;
      cursor: not-allowed;
    }

    /* نافذة النتيجة */
    #winner-modal {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0.8);
      background: rgba(15, 23, 42, 0.95);
      border: 2px solid var(--accent-color);
      box-shadow: 0 0 50px rgba(0, 255, 204, 0.5);
      border-radius: 16px;
      padding: 30px 50px;
      text-align: center;
      opacity: 0;
      pointer-events: none;
      transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      z-index: 100;
    }

    #winner-modal.active {
      opacity: 1;
      pointer-events: auto;
      transform: translate(-50%, -50%) scale(1);
    }

    #winner-modal h1 {
      font-size: 2.5rem;
      color: #fff;
      margin-bottom: 10px;
    }

    #winner-modal p {
      font-size: 1.2rem;
      color: var(--accent-color);
    }

    .close-btn {
      margin-top: 20px;
      background: transparent;
      border: 1px solid var(--accent-color);
      color: var(--accent-color);
      padding: 8px 20px;
      border-radius: 6px;
      cursor: pointer;
    }

    @media (max-width: 768px) {
      body { flex-direction: column-reverse; }
      .sidebar { width: 100%; height: 35%; }
      #canvas-container { height: 65%; }
    }
  </style>

  <!-- Three.js Library & OrbitControls -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <!-- Canvas Confetti Library -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
</head>
<body>

  <div class="sidebar">
    <h2>🎯 السحب ثلاثي الأبعاد</h2>
    <div class="input-group">
      <label for="names-input">أسماء المتسابقين (اسم بكل سطر):</label>
      <textarea id="names-input">أحمد
مريم
سيف
سارة
خالد
نور
علي
ريم</textarea>
    </div>
    <button id="spin-btn" class="btn-spin">تدوير العجلة ✨</button>
  </div>

  <div id="canvas-container">
    <div id="winner-modal">
      <p>🎉 الفائز في السحب 🎉</p>
      <h1 id="winner-name">الاسم</h1>
      <button class="close-btn" onclick="closeModal()">إغلاق</button>
    </div>
  </div>

  <script>
    // --- إعداد المشهد ثلاثي الأبعاد (Three.js Setup) ---
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x0b0e14, 0.015);

    const camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 1000);
    camera.position.set(0, 0, 14);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(container.clientWidth, container.clientHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    container.appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.maxDistance = 25;
    controls.minDistance = 5;

    // --- الإضاءة (Lighting) ---
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
    scene.add(ambientLight);

    const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
    dirLight.position.set(5, 12, 8);
    dirLight.castShadow = true;
    dirLight.shadow.mapSize.width = 2048;
    dirLight.shadow.mapSize.height = 2048;
    scene.add(dirLight);

    const pointLight = new THREE.PointLight(0x00ffcc, 1.5, 20);
    pointLight.position.set(0, 0, 5);
    scene.add(pointLight);

    // --- الصوتيات التفاعلية (Web Audio API) ---
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playTickSound() {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(800, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.04);
      gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
      gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.04);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.04);
    }

    // --- إنشاء العجلة والمؤشر 3D ---
    let wheelGroup = new THREE.Group();
    scene.add(wheelGroup);

    // مؤشر التوقف العلوي (3D Arrow Pointer)
    const pointerGroup = new THREE.Group();
    const pointerGeo = new THREE.ConeGeometry(0.4, 1.2, 4);
    const pointerMat = new THREE.MeshStandardMaterial({ color: 0xff0055, metalness: 0.8, roughness: 0.2 });
    const pointerMesh = new THREE.Mesh(pointerGeo, pointerMat);
    pointerMesh.rotation.z = Math.PI;
    pointerMesh.position.set(0, 4.3, 0.6);
    pointerGroup.add(pointerMesh);
    scene.add(pointerGroup);

    // ألوان القطاعات
    const palette = [0xff3366, 0x33ccff, 0x33ff99, 0xffcc33, 0x9933ff, 0xff6633, 0x00f5d4, 0x7b2cbf];

    function createWheelTexture(names) {
      const canvas = document.createElement('canvas');
      canvas.width = 2048;
      canvas.height = 2048;
      const ctx = canvas.getContext('2d');
      const numSlices = names.length;
      const sliceAngle = (Math.PI * 2) / numSlices;

      ctx.translate(1024, 1024);

      for (let i = 0; i < numSlices; i++) {
        const startAngle = i * sliceAngle;
        const endAngle = startAngle + sliceAngle;

        // رسم القطاع
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.arc(0, 0, 1000, startAngle, endAngle);
        ctx.closePath();
        ctx.fillStyle = '#' + palette[i % palette.length].toString(16).padStart(6, '0');
        ctx.fill();
        ctx.lineWidth = 8;
        ctx.strokeStyle = '#ffffff';
        ctx.stroke();

        // رسم النص
        ctx.save();
        ctx.rotate(startAngle + sliceAngle / 2);
        ctx.textAlign = "right";
        ctx.fillStyle = "#ffffff";
        ctx.font = "bold 65px sans-serif";
        ctx.shadowColor = "rgba(0, 0, 0, 0.6)";
        ctx.shadowBlur = 12;
        ctx.fillText(names[i], 900, 20);
        ctx.restore();
      }

      return new THREE.CanvasTexture(canvas);
    }

    function build3DWheel() {
      // تفريغ العجلة الحالية
      while(wheelGroup.children.length > 0){ 
        wheelGroup.remove(wheelGroup.children[0]); 
      }

      const names = getNames();
      if(names.length === 0) return;

      const radius = 4;
      const thickness = 0.6;

      // أسطوانة العجلة
      const geometry = new THREE.CylinderGeometry(radius, radius, thickness, 64);
      const texture = createWheelTexture(names);
      
      // مادة الوجه العلوي مع النسيج
      const topMaterial = new THREE.MeshStandardMaterial({
        map: texture,
        metalness: 0.1,
        roughness: 0.3
      });

      // مادة الإطار الجانبي والخلفي
      const sideMaterial = new THREE.MeshStandardMaterial({
        color: 0x1a202c,
        metalness: 0.9,
        roughness: 0.1
      });

      const materials = [sideMaterial, topMaterial, sideMaterial];
      const wheelMesh = new THREE.Mesh(geometry, materials);
      wheelMesh.rotation.x = Math.PI / 2;
      wheelMesh.castShadow = true;
      wheelMesh.receiveShadow = true;

      wheelGroup.add(wheelMesh);

      // إضافة محور مذهب في المنتصف
      const centerGeo = new THREE.CylinderGeometry(0.6, 0.6, thickness + 0.1, 32);
      const centerMat = new THREE.MeshStandardMaterial({ color: 0xffd700, metalness: 0.9, roughness: 0.1 });
      const centerCap = new THREE.Mesh(centerGeo, centerMat);
      centerCap.rotation.x = Math.PI / 2;
      wheelGroup.add(centerCap);
    }

    function getNames() {
      const val = document.getElementById('names-input').value.trim();
      return val ? val.split('\n').filter(n => n.trim() !== '') : [];
    }

    // --- منطق الدوران والفيزياء (Physics & Animation) ---
    let isSpinning = false;
    let currentRotation = 0;

    document.getElementById('spin-btn').addEventListener('click', spinWheel);
    document.getElementById('names-input').addEventListener('input', () => {
      if(!isSpinning) build3DWheel();
    });

    function spinWheel() {
      if (isSpinning) return;
      const names = getNames();
      if (names.length < 2) {
        alert("يرجى إدخال اسمين على الأقل!");
        return;
      }

      isSpinning = true;
      document.getElementById('spin-btn').disabled = true;

      const numSlices = names.length;
      const sliceAngle = (Math.PI * 2) / numSlices;

      // تحديد دورات العشوائية
      const extraRounds = 5 + Math.floor(Math.random() * 5); 
      const randomTargetAngle = Math.random() * Math.PI * 2;
      const totalRotation = currentRotation + (extraRounds * Math.PI * 2) + randomTargetAngle;

      const duration = 6000; // 6 ثوانٍ
      const startTime = performance.now();
      let lastSliceIndex = -1;

      function animateSpin(currentTime) {
        const elapsed = currentTime - startTime;
        const progress = Math.min(elapsed / duration, 1);

        // دالة تباطؤ احترافية (Cubic Ease-Out)
        const easeOut = 1 - Math.pow(1 - progress, 4);
        const angle = currentRotation + (totalRotation - currentRotation) * easeOut;

        wheelGroup.rotation.z = angle;

        // حساب صوت التكتكة مع كل قطاع
        const normalizedAngle = (angle % (Math.PI * 2) + Math.PI * 2) % (Math.PI * 2);
        const currentSliceIndex = Math.floor(normalizedAngle / sliceAngle);

        if (currentSliceIndex !== lastSliceIndex) {
          playTickSound();
          // هزة خفيفة للمؤشر عند التكتكة
          pointerMesh.rotation.x = 0.3;
          setTimeout(() => pointerMesh.rotation.x = 0, 50);
          lastSliceIndex = currentSliceIndex;
        }

        if (progress < 1) {
          requestAnimationFrame(animateSpin);
        } else {
          currentRotation = angle % (Math.PI * 2);
          isSpinning = false;
          document.getElementById('spin-btn').disabled = false;
          showWinner(names);
        }
      }

      requestAnimationFrame(animateSpin);
    }

    function showWinner(names) {
      const numSlices = names.length;
      const sliceAngle = (Math.PI * 2) / numSlices;

      // حساب الاسم الواقف عند المؤشر العلوي (زاوية π/2)
      let winningAngle = (Math.PI / 2 - currentRotation) % (Math.PI * 2);
      if (winningAngle < 0) winningAngle += Math.PI * 2;

      const winningIndex = Math.floor(winningAngle / sliceAngle) % numSlices;
      const winner = names[winningIndex];

      document.getElementById('winner-name').innerText = winner;
      document.getElementById('winner-modal').classList.add('active');

      // إطلاق الألعاب النارية (Confetti)
      confetti({
        particleCount: 150,
        spread: 80,
        origin: { y: 0.6 }
      });
    }

    function closeModal() {
      document.getElementById('winner-modal').classList.remove('active');
    }

    // --- التكيف مع حجم الشاشة والتحديث المستمر ---
    window.addEventListener('resize', () => {
      camera.aspect = container.clientWidth / container.clientHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(container.clientWidth, container.clientHeight);
    });

    // Ring Animation Loop
    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }

    build3DWheel();
    animate();
  </script>
</body>
</html>
